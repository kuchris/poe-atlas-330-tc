<!doctype html><html lang="zh-Hant"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>輿圖天賦樹 3.30 繁中</title>
<link rel="stylesheet" href="style.css">
<header>
  <nav><a href="#" class=on>輿圖天賦樹 3.30 繁中</a> <a href="https://hypostasis.faith/atlas/data.html" target="_blank" rel="noopener">英文原版</a></nav>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋節點（中英皆可）" autocomplete="off" title="以節點名稱或效果文字搜尋，中英文皆可。Enter：下一個結果，Esc：清除">
    <span id="hits"></span>
  </div>
  <div class="zoom">
    <button id="out" title="縮小">&minus;</button>
    <span id="pct"></span>
    <button id="in" title="放大">+</button>
    <button id="fit" title="整棵樹符合畫面">全覽</button>
    <button id="bg" title="顯示／隱藏背景（B）">背景</button>
    <button id="toggle" title="顯示／隱藏已選面板">已選 <span id="badge">0</span></button>
  </div>
</header>
<canvas id="c"></canvas>
<aside id="panel">
  <div class="ph">
    <span id="count"></span>
    <button id="clear">清除</button>
  </div>
  <p id="empty">點擊天賦樹上的節點即可選取（最多 <span id="max"></span> 點），效果會在這裡加總。有多個選項的節點會詢問你要選哪一個。</p>
  <h3>效果加總</h3>
  <ul id="effects"></ul>
  <h3>已選節點</h3>
  <ul id="picked"></ul>
</aside>
<div id="tip"></div>
<div id="menu"></div>
<script src="trees/data.js"></script>
<script src="viewer.js"></script>

</body></html>
